apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: hrms
  labels:
    app: api
    tier: app
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        tier: app
    spec:
      containers:
        - name: api
          image: hrms-api:latest
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hrms-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: hrms-secrets
                  key: REDIS_URL
            - name: JWT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: hrms-secrets
                  key: JWT_SIGNING_KEY
            - name: AUTOMATION_CALLBACK_SECRET
              valueFrom:
                secretKeyRef:
                  name: hrms-secrets
                  key: AUTOMATION_CALLBACK_SECRET
            - name: PSEUDONYMIZATION_PEPPER
              valueFrom:
                secretKeyRef:
                  name: hrms-secrets
                  key: PSEUDONYMIZATION_PEPPER
            - name: ENVIRONMENT
              value: "production"
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: hrms
spec:
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: api

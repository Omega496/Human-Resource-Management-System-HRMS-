apiVersion: v1
kind: Secret
metadata:
  name: hrms-secrets
  namespace: hrms
type: Opaque
stringData:
  # Connection strings and encryption keys.
  # In a production environment, these are injected by an external secrets manager
  # (e.g., HashiCorp Vault, AWS Secrets Manager, GCP Secret Manager) via a secrets operator.
  DATABASE_URL: "postgresql+asyncpg://hrms_app:hrms_app_password@postgres-service.hrms.svc.cluster.local:5432/hrms_db"
  DATABASE_SUPERUSER_URL: "postgresql+asyncpg://hrms_user:hrms_password@postgres-service.hrms.svc.cluster.local:5432/hrms_db"
  REDIS_URL: "redis://redis-service.hrms.svc.cluster.local:6379/0"
  JWT_SIGNING_KEY: "change_this_to_a_secure_random_key_minimum_32_characters_long"
  AUTOMATION_CALLBACK_SECRET: "change_this_to_a_secure_hmac_callback_secret_key"
  PSEUDONYMIZATION_PEPPER: "change_this_to_a_secure_gdpr_pseudonymization_pepper_key"
